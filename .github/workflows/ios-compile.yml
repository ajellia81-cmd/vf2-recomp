name: iOS compile checks (no IPA)
on:
  push:
    branches: [ios-port]
    paths: ['ios/**', 'src/**', 'third_party/**', '.github/workflows/ios-compile.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-compile-${{ github.ref }}
  cancel-in-progress: false
jobs:
  interpreter:
    if: github.repository == 'ajellia81-cmd/vf2-recomp'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test native pixel coordinates without ROMs
        run: |
          mkdir -p build/bin-tests
          c++ -std=c++20 -O2 tools/checks/pixel_grid.cpp -o build/bin-tests/pixel-grid
          build/bin-tests/pixel-grid
      - name: Build ROM-free interpreter tool
        run: make JIT=0 OBJ=build/obj-interp BIN=build/bin-interp build/bin-interp/vf2run -j2
      - name: Verify missing-archive diagnostic and absence of SLJIT
        shell: bash
        run: |
          set +e
          build/bin-interp/vf2run /nonexistent/vf2.zip 1 > build/missing-rom.log 2>&1
          result=$?
          set -e
          test "$result" = 1
          grep -q "Couldn't read" build/missing-rom.log
          if nm -C build/bin-interp/vf2run | grep -q sljit_; then exit 1; fi
  ios:
    if: github.repository == 'ajellia81-cmd/vf2-recomp'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install project generator
        run: brew install xcodegen sdl3
      - name: Identify Apple toolchain
        id: toolchain
        run: echo "key=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: dependencies
        with:
          path: |
            ios/Dependencies/*.xcframework
            ios/build/licenses
          key: ios-static-${{ runner.os }}-${{ steps.toolchain.outputs.key }}-${{ hashFiles('ios/Dependencies/versions.env', 'ios/Scripts/prepare-dependencies.sh') }}
      - name: Prepare redistributable libraries only
        if: steps.dependencies.outputs.cache-hit != 'true'
        run: sh ios/Scripts/prepare-dependencies.sh
      - uses: actions/cache/save@v4
        if: steps.dependencies.outputs.cache-hit != 'true'
        with:
          path: |
            ios/Dependencies/*.xcframework
            ios/build/licenses
          key: ${{ steps.dependencies.outputs.cache-primary-key }}
      - name: Test native Metal rasterization with synthetic geometry
        shell: bash
        run: |
          mkdir -p ios/build
          xcrun clang++ -std=c++20 -O2 -Werror=return-type -fobjc-arc tools/checks/metal_native_grid.mm src/gpu/gpu3d_metal.mm \
            -framework Metal -framework Foundation -framework CoreVideo -framework QuartzCore -o ios/build/metal-native-grid
          set +e
          ios/build/metal-native-grid
          result=$?
          set -e
          if [ "$result" = 77 ]; then echo 'Metal runtime test skipped: inspect the message above.'; else exit "$result"; fi
      - name: Test display composition without game data
        run: |
          mkdir -p ios/build
          xcrun clang++ -std=c++20 -O2 -Werror=return-type -I"$(brew --prefix sdl3)/include" -Isrc/core/shim_include \
            tools/checks/display_pipeline.cpp src/host/d3d11_map.cpp \
            -L"$(brew --prefix sdl3)/lib" -lSDL3 -o ios/build/display-pipeline
          ios/build/display-pipeline
          xcrun clang++ -std=c++20 -O2 -Werror=return-type -I"$(brew --prefix sdl3)/include" tools/checks/controls_config.cpp \
            -L"$(brew --prefix sdl3)/lib" -lSDL3 -o ios/build/controls-config
          ios/build/controls-config
      - name: Check dependencies and generate Xcode project
        run: |
          mkdir -p ios/build
          sh ios/Scripts/preflight.sh
          python3 ios/Scripts/prepare-app-icon.py
          xcodegen generate --spec ios/project.yml
          python3 ios/Scripts/verify-project.py
      - name: Compile unsigned iPhone app (no archive or export)
        run: |
          xcodebuild -project ios/VF2Recomp.xcodeproj -scheme VF2Recomp \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build/device CODE_SIGNING_ALLOWED=NO build > ios/build/device.log 2>&1 || {
              grep -n -m 40 "error:" ios/build/device.log || true
              tail -80 ios/build/device.log; exit 1;
            }
      - name: Compile unsigned simulator app
        run: |
          xcodebuild -project ios/VF2Recomp.xcodeproj -scheme VF2Recomp \
            -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/build/simulator CODE_SIGNING_ALLOWED=NO build > ios/build/simulator.log 2>&1 || {
              grep -n -m 40 "error:" ios/build/simulator.log || true
              tail -80 ios/build/simulator.log; exit 1;
            }
      # Deliberately no archive, -exportArchive, IPA packaging, artifact upload, or release.
